[project]
name = "oplan"
version = "1.0.0"
description = "О!План — проверяемая поездка от идеи до демонстрационного заказа"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "SIM", "BLE"]
